<!DOCTYPE html>
<html lang="en" class="@THEME@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monivo</title>
<style>
:root{--bg:#fff;--fg:#000;--dim:#999}
html.dark{--bg:#000;--fg:#fff}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:300 16px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-weight:300;font-size:28px;letter-spacing:2px;text-transform:uppercase;margin:0 0 16px}
p{color:var(--dim);font-size:12px;letter-spacing:1px;margin:4px}
</style>
</head>
<body>
<h1>Monivo</h1>
<p>Privacy first &bull; No history &bull; No tracking</p>
<p>Ctrl+L search &bull; Ctrl+H home</p>
</body>
</html>
